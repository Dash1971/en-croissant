name: Test
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check maintained fork evidence tooling
        if: github.repository == 'Dash1971/en-croissant'
        run: |
          python3 -m unittest discover -s scripts/fork -p 'test_*.py'
          python3 scripts/fork/manage.py register-check

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"

      - name: Sync node version and setup cache
        uses: actions/setup-node@v3
        with:
          node-version: "24.22.3"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint:ci

      - name: Run tests
        run: pnpm test
